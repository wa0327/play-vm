# Windows 11 ARM64 — qemu.sh 的設定 (路徑相對於本目錄 <os>/qemu/; $ROOT 是專案根目錄)
NAME=win11
DISK=disk.qcow2
DISK_BUS=nvme                      # Windows 內建 NVMe 驅動, 安裝程式直接看得到磁碟
VARS=vars.fd                        # UEFI 變數 (每台 VM 獨立一份)
INSTALL_ISO=../windows.iso            # 共用的安裝光碟在 OS 目錄 (上一層)
DRIVERS_ISO=../../virtio/virtio-win.iso
RAMFB_MODES="install drivers safe" # 這些模式用 ramfb (沒有 virtio 顯示驅動也能顯示)
XRES=2560
YRES=1664

# 共享資料夾 (SMB, 只在該次啟動有效): "名稱:路徑:模式"  ro=唯讀 rw=可寫
# Windows 內開 \\10.0.2.100\<名稱>
SHARES=(
  "downloads:$HOME/Downloads:ro"
  "docs:$HOME/Documents:ro"
  "share:$ROOT/share:rw"
)

# 埠轉發 (Mac -> VM, 只綁本機): 遠端桌面連 localhost:3389
# (Windows 11 Pro: 設定 > 系統 > 遠端桌面 開啟; 帳號要有密碼)
HOSTFWD=(
  "tcp:127.0.0.1:3389-:3389"
)
