# Ubuntu 26.04 ARM64 — krunkit.sh 的設定 (路徑相對於本目錄 <os>/krunkit/)
NAME=ubuntu
DISK=../vfkit/disk.img             # 直接重用 vfkit 已安裝好的 raw 磁碟 (不要與 vfkit 同時開)
VARS=vars.fd                       # krunkit 內建 EFI 的變數檔, 首次開機自動建立
CPUS=4
MEMORY_MB=4096
XRES=1280
YRES=800
MAC=52:54:00:aa:bb:02
SSH_PORT=2222                      # gvproxy 把主機 127.0.0.1:2222 轉到 VM 的 22
