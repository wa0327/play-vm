# Ubuntu 26.04 ARM64 — vfkit.sh 的設定 (路徑相對於本目錄 <os>/vfkit/; $ROOT 是專案根目錄)
NAME=ubuntu
DISK=disk.img                      # raw 稀疏檔 (vfkit 不支援 qcow2); install 時自動建立
DISK_SIZE=64G
VARS=vars.fd                       # Apple EFI 的變數檔, 首次開機自動建立
INSTALL_ISO=../ubuntu.iso          # 共用的安裝光碟在 OS 目錄 (上一層)
XRES=2560
YRES=1600
MAC=52:54:00:aa:bb:01              # 固定 MAC, 方便從 /var/db/dhcpd_leases 找到 VM 的 IP

# 共享資料夾 (virtio-fs, 沒有唯讀選項): "標籤:路徑"
# SHARES=(
#   "share:$ROOT/share"
# )
