# Ubuntu 26.04 ARM64 — vz.sh 的設定 (路徑相對於本目錄 <os>/vz/; $ROOT 是專案根目錄)
NAME=ubuntu
DISK=../qemu/disk.raw              # 與 qemu.sh 共用同一顆 raw 磁碟 (不要兩邊同時開)
DIRECT_DIR=../qemu/direct          # kernel / cmdline / rootdev 也共用 qemu 的 extract 輸出
VARS=vars.fd                       # 只有 --efi / install 會用
INSTALL_ISO=../ubuntu.iso
XRES=2560
YRES=1600
MAC=52:54:00:aa:bb:02              # 固定 MAC, 方便從 /var/db/dhcpd_leases 查 IP (./vz.sh ubuntu ip)
# INITRD=                          # 預設不用 initrd; 開機失敗 (缺 virtio 模組) 再設為 $DIRECT_DIR/initrd.img
# 共享資料夾 (virtio-fs): "標籤:路徑[:ro]", guest 內 mount -t virtiofs <標籤> <掛載點>
# SHARES=("share:$ROOT/share")
# 埠轉發 (Mac 127.0.0.1 -> VM, 格式 "本機埠:VM埠"): ssh -p 2222 localhost   (VM 裡要裝 openssh-server)
HOSTFWD=(
  "2222:22"
)
