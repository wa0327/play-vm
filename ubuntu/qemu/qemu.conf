# Ubuntu 26.04 ARM64 — qemu.sh 的設定 (路徑相對於本目錄 <os>/qemu/; $ROOT 是專案根目錄)
NAME=ubuntu
CPUS=8
RAM=8G
DISK=disk.qcow2
DISK_BUS=virtio-blk                # Linux 內建 virtio 驅動
VARS=vars.fd
INSTALL_ISO=../ubuntu.iso            # 共用的安裝光碟在 OS 目錄 (上一層)
XRES=2560
YRES=1600
# 沒有 SHARES: Linux 之後可改用 virtiofs / sshfs, 這裡不設共享

# 埠轉發 (Mac -> VM, 只綁本機): ssh -p 2222 localhost   (VM 裡要裝 openssh-server)
HOSTFWD=(
  "tcp:127.0.0.1:2222-:22"
)
